<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Login | SEO Command Center</title>
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>

<body class="login-page">

<div class="login-wrapper">

    <div class="login-brand">
        <div class="brand-logo">JA</div>
        <h1>SEO Command Center</h1>
        <p>Jonayed Ahmed · SEO Management Platform</p>
    </div>

    <div class="login-card">

        <div class="login-heading">
            <h2>Welcome back</h2>
            <p>Sign in to access your SEO dashboard.</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <span>◉</span>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <span>●</span>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="password-toggle" id="togglePassword">
                        Show
                    </button>
                </div>
            </div>

            <div class="login-options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    <span>Remember me</span>
                </label>

                <a href="#" onclick="showLoginMessage('Password recovery will be connected with the secure backend later.'); return false;">
                    Forgot password?
                </a>
            </div>

            <button type="submit" class="login-button">
                Login to Dashboard
                <span>→</span>
            </button>

            <div id="loginMessage" class="login-message"></div>

        </form>

    </div>

    <div class="login-footer">
        <span>© 2026 Jonayed Ahmed</span>
        <span>·</span>
        <span>SEO Command Center</span>
    </div>

</div>

<script src="assets/js/dashboard.js"></script>

</body>
</html>
